name: Release

on:
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      # Actions are pinned to commit SHAs, not tags: this job holds the key that
      # signs auto-updates, so a moved tag or a compromised release must not be
      # able to run code here. Update the SHA and the comment together.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # dtolnay/rust-toolchain picks the toolchain from the ref it is called
      # with, so pinning a SHA needs `toolchain:` spelled out.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: |
            src-tauri
            installer-app/src-tauri

      - name: Verify version matches tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::This workflow must run on a version tag (e.g. v3.8.7)."
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          if [[ $VERSION =~ ^[0-9]+\.[0-9]+$ ]]; then
            VERSION="$VERSION.0"
          fi

          PKG_VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          CONF_VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version)")
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          INSTALLER_PKG_VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('installer-app/package.json','utf8')).version)")
          INSTALLER_CONF_VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('installer-app/src-tauri/tauri.conf.json','utf8')).version)")
          INSTALLER_CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' installer-app/src-tauri/Cargo.toml | head -n 1)

          echo "Tag: $VERSION | package.json: $PKG_VERSION | tauri.conf.json: $CONF_VERSION | Cargo.toml: $CARGO_VERSION"
          echo "installer-app -- package.json: $INSTALLER_PKG_VERSION | tauri.conf.json: $INSTALLER_CONF_VERSION | Cargo.toml: $INSTALLER_CARGO_VERSION"

          if [ "$PKG_VERSION" != "$VERSION" ] || [ "$CONF_VERSION" != "$VERSION" ] || [ "$CARGO_VERSION" != "$VERSION" ] || \
             [ "$INSTALLER_PKG_VERSION" != "$VERSION" ] || [ "$INSTALLER_CONF_VERSION" != "$VERSION" ] || [ "$INSTALLER_CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Version files do not match tag $VERSION. Run 'bun run bump $VERSION' and commit before tagging."
            exit 1
          fi

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          COMMIT_COUNT=$(git rev-list --count --no-merges "$RANGE")

          COMPARE=""
          if [ -n "$PREV_TAG" ]; then
            COMPARE=$(printf "\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s" "$GITHUB_REPOSITORY" "$PREV_TAG" "$TAG")
          fi

          HEAD_BODY=$(git log -1 --pretty=format:"%b" --no-merges)
          if [ "$COMMIT_COUNT" -eq 1 ] || printf "%s" "$HEAD_BODY" | grep -qE "^(### |What's New:?$|Improvements:?$|Changed:?$|Bug Fixes:?$)"; then
            BODY=$(git log "$RANGE" -1 --pretty=format:"%b" --no-merges)
            if [ -z "$(printf "%s" "$BODY" | tr -d "[:space:]")" ]; then
              BODY=$(git log "$RANGE" -1 --pretty=format:"%s" --no-merges)
            fi
            BODY=$(printf "%s" "$BODY" | sed -E "s/^(What's New|Improvements|Changed|Bug Fixes|Other):?$/### \1/")
            NOTES=$(printf "%s%s\n" "$BODY" "$COMPARE")
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            echo "$NOTES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMITS=$(git log "$RANGE" --pretty=format:"%s" --no-merges)

          FEATURES=""
          FIXES=""
          OTHER=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if [[ "$line" =~ ^feat[\(:] ]]; then
              FEATURES+=$(printf "\n- %s" "${line#*: }")
            elif [[ "$line" =~ ^fix[\(:] ]]; then
              FIXES+=$(printf "\n- %s" "${line#*: }")
            else
              OTHER+=$(printf "\n- %s" "$line")
            fi
          done <<< "$COMMITS"

          NOTES=""
          if [ -n "$FEATURES" ]; then
            NOTES+=$(printf "\n\n### What's New%s\n" "$FEATURES")
          fi
          if [ -n "$FIXES" ]; then
            NOTES+=$(printf "\n\n### Bug Fixes%s\n" "$FIXES")
          fi
          if [ -n "$OTHER" ]; then
            NOTES+=$(printf "\n\n### Other%s\n" "$OTHER")
          fi
          NOTES=$(printf "%s%s\n" "$NOTES" "$COMPARE" | sed '/./,$!d')
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: bun install

      # Pinned like the actions above. Every action in this job can read the
      # signing key through the environment, so none of them may float.
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@e834788a94591d81e3ae0bd9ec06366f5afb8994 # v0.5.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Nectar ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # The NSIS installer only feeds the updater, so it gets a name that does not look like the installer
      - name: Rename the updater installer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OLD="nectar_${VERSION}_x64-setup.exe"
          NEW="nectar_${VERSION}_x64-updater.exe"
          mkdir -p updater-rename
          gh release download "${{ github.ref_name }}" -p "$OLD" -p latest.json -D updater-rename --clobber
          mv "updater-rename/$OLD" "updater-rename/$NEW"
          sed -i "s|$OLD|$NEW|g" updater-rename/latest.json
          grep -q "$NEW" updater-rename/latest.json
          gh release upload "${{ github.ref_name }}" "updater-rename/$NEW" updater-rename/latest.json --clobber
          gh release delete-asset "${{ github.ref_name }}" "$OLD" -y

      # tauri-action only uploads the NSIS installer (which now offers a
      # "just me" / "all users" choice via installMode: "both" in
      # tauri.conf.json). This adds a second, install-free artifact — the raw
      # compiled exe, zipped — for people who just want to run it without
      # installing anything.
      - name: Package portable build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd src-tauri/target/release
          7z a "nectar-${VERSION}-portable-windows-x64.zip" nectar.exe
          mv "nectar-${VERSION}-portable-windows-x64.zip" "$GITHUB_WORKSPACE/"

      - name: Upload portable build to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "${{ github.ref_name }}" "nectar-${VERSION}-portable-windows-x64.zip" --clobber

      # The NSIS installer above exists only to feed the silent auto-updater
      # (tauri-plugin-updater only recognizes NSIS/MSI artifacts). This custom
      # installer-app/ build is the actual thing people download and run —
      # see installer-app/README.md for why the two are separate.
      - name: Package installer payload
        shell: pwsh
        run: |
          Compress-Archive -Path "src-tauri/target/release/nectar.exe" -DestinationPath "installer-app/src-tauri/payload.zip" -Force

      - name: Install installer-app dependencies
        working-directory: installer-app
        # npm ci installs exactly what package-lock.json pins; npm install would
        # accept newer matching versions in the job that signs the release.
        run: npm ci

      - name: Build custom installer
        working-directory: installer-app
        run: npm run tauri build -- --no-bundle

      - name: Rename and upload custom installer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="Nectar-Setup-${VERSION}.exe"
          cp "installer-app/src-tauri/target/release/nectar-installer.exe" "$OUT"
          gh release upload "${{ github.ref_name }}" "$OUT" --clobber

      # README tells people to verify against SHA256SUMS.txt, so the release has
      # to actually carry one. Generated here, from the exact files uploaded above.
      - name: Publish SHA256SUMS.txt
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf sums && mkdir -p sums
          gh release download "${{ github.ref_name }}" \
            -p "Nectar-Setup-${VERSION}.exe" \
            -p "nectar-${VERSION}-portable-windows-x64.zip" \
            -p "nectar_${VERSION}_x64-updater.exe" \
            -D sums --clobber
          cd sums
          # Only the release artifacts, never an earlier SHA256SUMS.txt.
          sha256sum -- *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber
